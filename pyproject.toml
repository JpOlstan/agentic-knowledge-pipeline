[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "knowledge-agents"
version = "0.1.0"
description = "Governed multi-source knowledge acquisition pipeline"
readme = { text = "Agentic knowledge acquisition pipeline.", content-type = "text/plain" }
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "JpOlstan" }]
dependencies = [
    "aiosqlite>=0.21,<1",
    "boto3>=1.40,<2",
    "httpcore>=1.0,<2",
    "httpx>=0.28,<1",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "openai>=2.45,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "qdrant-client>=1.18,<2",
    "trafilatura>=2.2,<3",
    "typer>=0.16,<1",
]

[project.scripts]
knowledge-agents = "knowledge_agents.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]
live = []
eval = []

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_agents"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "live: requires explicitly configured external services and credentials",
    "eval: runs an explicitly authorized comparative evaluation",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
