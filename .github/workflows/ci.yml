name: Offline CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python security and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.30"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lock and install dependencies
        run: |
          uv lock --check --offline
          uv sync --locked --all-groups

      - name: Scan repository for credentials
        run: uv run python scripts/secret_scan.py

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Run offline tests
        run: uv run pytest -m "not live and not eval" -q

  terraform:
    name: Terraform static validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        working-directory: infra/terraform
        run: terraform init -backend=false -lockfile=readonly -input=false

      - name: Validate Terraform
        working-directory: infra/terraform
        run: terraform validate -no-color
